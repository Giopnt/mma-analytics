version: '3.8'

x-airflow-common: &airflow-common
  image: apache/airflow:2.9.0
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow_db/airflow
    AIRFLOW__CORE__FERNET_KEY: 'ZmDfcTF7_60GrrY167zsiPd67pEvs0aGOv2oasOM1Pg='
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__WEBSERVER__SECRET_KEY: 'mma_analytics_secret'
    MMA_DB_HOST: postgres
    MMA_DB_PORT: 5432
    MMA_DB_NAME: mma_warehouse
    MMA_DB_USER: mma
    MMA_DB_PASSWORD: mma_pass
    MINIO_ENDPOINT: http://minio:9000
    MINIO_ACCESS_KEY: mma_access
    MINIO_SECRET_KEY: mma_secret123
    MINIO_BUCKET: mma-raw
    RAW_DATA_PATH: /opt/airflow/data/raw
  volumes:
    - ./dags:/opt/airflow/dags
    - ./ingestion:/opt/airflow/ingestion
    - ./warehouse:/opt/airflow/warehouse
    - ./transforms:/opt/airflow/transforms
    - ./data:/opt/airflow/data
    - ./logs:/opt/airflow/logs
  depends_on:
    airflow_db:
      condition: service_healthy

services:
  postgres:
    image: postgres:16
    container_name: mma_postgres
    environment:
      POSTGRES_USER: mma
      POSTGRES_PASSWORD: mma_pass
      POSTGRES_DB: mma_warehouse
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./warehouse/sql/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mma -d mma_warehouse"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  airflow_db:
    image: postgres:16
    container_name: mma_airflow_db
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: mma_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: mma_access
      MINIO_ROOT_PASSWORD: mma_secret123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  minio_setup:
    image: minio/mc:latest
    container_name: mma_minio_setup
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: /bin/sh -c "mc alias set local http://minio:9000 mma_access mma_secret123 && mc mb --ignore-existing local/mma-raw && echo 'Bucket ready.'"
    restart: "no"

  airflow_init:
    <<: *airflow-common
    container_name: mma_airflow_init
    entrypoint: /bin/bash -c "airflow db migrate && airflow users create --username admin --password admin --firstname MMA --lastname Admin --role Admin --email admin@mma.local"
    restart: "no"

  airflow_webserver:
    <<: *airflow-common
    container_name: mma_airflow_webserver
    command: webserver
    ports:
      - "8080:8080"
    depends_on:
      airflow_init:
        condition: service_completed_successfully
    restart: unless-stopped

  airflow_scheduler:
    <<: *airflow-common
    container_name: mma_airflow_scheduler
    command: scheduler
    depends_on:
      airflow_init:
        condition: service_completed_successfully
    restart: unless-stopped

  superset:
    image: apache/superset:3.1.0
    container_name: mma_superset
    environment:
      SUPERSET_SECRET_KEY: 'mma_superset_secret_key_change_in_prod'
      SUPERSET_WEBSERVER_PORT: 8088
    ports:
      - "8088:8088"
    volumes:
      - superset_data:/app/superset_home
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  superset_init:
    image: apache/superset:3.1.0
    container_name: mma_superset_init
    environment:
      SUPERSET_SECRET_KEY: 'mma_superset_secret_key_change_in_prod'
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      bash -c "superset db upgrade &&
      superset fab create-admin --username admin --firstname MMA --lastname Admin --email admin@mma.local --password admin &&
      superset init &&
      echo 'Superset ready.'"
    volumes:
      - superset_data:/app/superset_home
    restart: "no"

volumes:
  postgres_data:
  airflow_db_data:
  minio_data:
  superset_data: